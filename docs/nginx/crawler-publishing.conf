# Include inside the existing HTTPS server for www.zhengaihe.top.
# Preserve the existing /crawler/ static/SPA location, but do not use ^~ on it.
# Change the upstream only if the API is not listening on this host's port 8000.
location ~ "^/crawler/[0-9a-f]{32}$" {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
}

# Add this only if the existing server does not already define /api/.
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
